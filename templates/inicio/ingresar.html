{% extends 'base.html' %}
{% block titulo %}Ingresar{% endblock %}
{% block contenido %}
<div class="card login-card mx-auto mt-4">
  <div class="card-header"><i class="bi bi-box-arrow-in-right me-1"></i>Iniciar sesión</div>
  <div class="card-body">
    <form method="post" novalidate>
      {% csrf_token %}
      {% if form.non_field_errors %}
      <div class="alert alert-danger py-2">Usuario o contraseña incorrectos.</div>
      {% endif %}
      <div class="mb-3">
        <label class="form-label" for="{{ form.username.id_for_label }}">Usuario</label>
        <input type="text" name="username" id="{{ form.username.id_for_label }}" class="form-control" autofocus required>
      </div>
      <div class="mb-3">
        <label class="form-label" for="{{ form.password.id_for_label }}">Contraseña</label>
        <input type="password" name="password" id="{{ form.password.id_for_label }}" class="form-control" required>
      </div>
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit" class="btn btn-primary w-100">Entrar</button>
    </form>
  </div>
</div>
{% endblock %}
